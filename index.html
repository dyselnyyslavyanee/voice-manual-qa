<!DOCTYPE html>
<html lang="uk" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocVoice — Multilingual Voice Assistant for PDF Manuals</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <style>
    .recording-pulse {
      animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
      background-color: #ef4444 !important;
    }
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { box-shadow: 0 0 0 16px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .drag-over {
      border-color: #10b981 !important;
      background-color: rgba(16, 185, 129, 0.1) !important;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-emerald-500 selection:text-black">

  <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-2">
        <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
        <h1 class="font-bold text-lg tracking-tight">DocVoice <span class="text-xs font-mono text-emerald-400 border border-emerald-500/30 px-1.5 py-0.5 rounded">3.1 Flash-Lite</span></h1>
      </div>
      
      <div class="flex items-center gap-3 text-xs">
        <button 
          id="ttsToggleBtn" 
          type="button"
          class="flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-emerald-400 px-2.5 py-1 rounded transition cursor-pointer"
          title="Toggle Voice Output"
        >
          <span id="ttsIcon">🔊</span>
          <span id="ttsLabel" class="font-medium">Voice ON</span>
        </button>

        <div class="flex items-center gap-1.5">
          <label for="apiKeyInput" class="text-slate-400">Key:</label>
          <input 
            type="password" 
            id="apiKeyInput" 
            placeholder="Gemini API key..."
            class="bg-slate-800 border border-slate-700 rounded px-2 py-1 text-slate-200 focus:outline-none focus:border-emerald-500 w-36 md:w-52"
          />
          <button id="saveKeyBtn" type="button" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 px-2.5 py-1 rounded text-slate-300 cursor-pointer">Save</button>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-6 flex-1 w-full grid grid-cols-1 md:grid-cols-12 gap-6">
    <section class="md:col-span-5 space-y-4">
      <div class="bg-slate-900/70 border border-slate-800 rounded-xl p-4">
        <h2 class="text-sm font-semibold text-slate-300 mb-2 flex items-center justify-between">
          <span>Manual Documents</span>
          <span id="docStatusBadge" class="text-xs font-normal text-amber-400 bg-amber-950/60 border border-amber-800 px-2 py-0.5 rounded-full">No PDF</span>
        </h2>
        
        <!-- Multiple PDF support -->
        <input type="file" id="pdfFileInput" accept="application/pdf" multiple class="hidden" />
        <div id="dropZone" class="border-2 border-dashed border-slate-700 hover:border-emerald-500/50 rounded-lg p-5 block text-center cursor-pointer transition bg-slate-950/40">
          <svg class="w-8 h-8 mx-auto text-slate-500 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
          </svg>
          <span class="text-xs text-slate-300 block font-medium">Click or drag & drop 1 or 2 PDFs</span>
          <span class="text-[11px] text-slate-500 block mt-1">Up to 2 files, max 10 pages total</span>
        </div>
        <div id="docFileList" class="text-xs text-emerald-400 mt-2 space-y-1 font-mono hidden"></div>
      </div>

      <div class="bg-slate-900/50 border border-slate-800 rounded-xl p-4 text-xs space-y-2">
        <div class="text-slate-400 font-semibold uppercase tracking-wider text-[10px]">Real-time Latency Metrics</div>
        <div class="flex justify-between items-center py-1 border-b border-slate-800/60">
          <span class="text-slate-400">Ingestion Time:</span>
          <span id="ingestionTimeVal" class="font-mono text-slate-200">0 ms</span>
        </div>
        <div class="flex justify-between items-center py-1">
          <span class="text-slate-400">Audible Response Time:</span>
          <span id="latencyTimeVal" class="font-mono text-emerald-400 font-bold">0 ms</span>
        </div>
      </div>

      <button id="clearChatBtn" type="button" class="w-full text-xs bg-slate-900 hover:bg-slate-800 border border-slate-700 py-2 rounded-lg text-slate-300 transition cursor-pointer">
        Clear Conversation
      </button>
    </section>

    <section class="md:col-span-7 flex flex-col space-y-4">
      <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-5 flex flex-col items-center justify-center text-center">
        <button 
          id="micBtn" 
          type="button"
          class="w-20 h-20 rounded-full bg-emerald-500 hover:bg-emerald-400 active:scale-95 flex items-center justify-center shadow-lg shadow-emerald-500/20 transition cursor-pointer"
        >
          <svg class="w-8 h-8 text-black" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
        </button>
        <div id="micStatus" class="text-xs font-medium text-slate-300 mt-3">Click mic and ask aloud</div>
        
        <div class="w-full mt-4 flex gap-2">
          <input 
            type="text" 
            id="textInput" 
            placeholder="Type your question..." 
            class="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-emerald-500"
          />
          <button id="sendTextBtn" type="button" class="bg-slate-800 hover:bg-slate-700 text-xs text-slate-200 px-4 py-2 rounded-lg border border-slate-600 cursor-pointer">
            Ask
          </button>
        </div>
      </div>

      <div class="flex-1 space-y-3" id="chatContainer">
        <div class="text-center py-10 text-slate-600 text-xs" id="emptyNotice">
          Upload 1 or 2 PDF manuals and ask questions by voice or text.
        </div>
      </div>
    </section>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let pdfPages = [];
      let conversationHistory = [];
      let isRecording = false;
      let recognition = null;
      let queryStartTime = 0;
      let isTtsEnabled = true;

      const apiKeyInput = document.getElementById('apiKeyInput');
      const saveKeyBtn = document.getElementById('saveKeyBtn');
      const ttsToggleBtn = document.getElementById('ttsToggleBtn');
      const ttsIcon = document.getElementById('ttsIcon');
      const ttsLabel = document.getElementById('ttsLabel');
      const pdfFileInput = document.getElementById('pdfFileInput');
      const dropZone = document.getElementById('dropZone');
      const docStatusBadge = document.getElementById('docStatusBadge');
      const docFileList = document.getElementById('docFileList');
      const ingestionTimeVal = document.getElementById('ingestionTimeVal');
      const latencyTimeVal = document.getElementById('latencyTimeVal');
      const micBtn = document.getElementById('micBtn');
      const micStatus = document.getElementById('micStatus');
      const textInput = document.getElementById('textInput');
      const sendTextBtn = document.getElementById('sendTextBtn');
      const chatContainer = document.getElementById('chatContainer');
      const emptyNotice = document.getElementById('emptyNotice');
      const clearChatBtn = document.getElementById('clearChatBtn');

      if (localStorage.getItem('gemini_api_key')) {
        apiKeyInput.value = localStorage.getItem('gemini_api_key');
      }

      saveKeyBtn.addEventListener('click', () => {
        const val = apiKeyInput.value.trim();
        localStorage.setItem('gemini_api_key', val);
        alert(val ? 'API Key saved!' : 'API Key cleared!');
      });

      ttsToggleBtn.addEventListener('click', () => {
        isTtsEnabled = !isTtsEnabled;
        if (!isTtsEnabled) {
          if ('speechSynthesis' in window) window.speechSynthesis.cancel();
          ttsIcon.textContent = '🔇';
          ttsLabel.textContent = 'Voice OFF';
          ttsToggleBtn.className = 'flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-500 px-2.5 py-1 rounded transition cursor-pointer';
        } else {
          ttsIcon.textContent = '🔊';
          ttsLabel.textContent = 'Voice ON';
          ttsToggleBtn.className = 'flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-emerald-400 px-2.5 py-1 rounded transition cursor-pointer';
        }
      });

      if (window.pdfjsLib) {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
      }

      dropZone.addEventListener('click', () => {
        pdfFileInput.click();
      });

      ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => {
          e.preventDefault();
          e.stopPropagation();
          dropZone.classList.add('drag-over');
        }, false);
      });

      ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => {
          e.preventDefault();
          e.stopPropagation();
          dropZone.classList.remove('drag-over');
        }, false);
      });

      dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropZone.classList.remove('drag-over');
        const files = Array.from(e.dataTransfer.files).filter(f => f.type === 'application/pdf');
        if (files.length > 0) {
          processPdfFiles(files.slice(0, 2));
        } else {
          alert('Please drop valid PDF file(s).');
        }
      });

      pdfFileInput.addEventListener('change', (e) => {
        const files = Array.from(e.target.files).filter(f => f.type === 'application/pdf');
        if (files.length > 0) {
          processPdfFiles(files.slice(0, 2));
        }
      });

      // Parsing up to 2 PDFs with a 10-page total cap
      async function processPdfFiles(files) {
        const startTime = performance.now();
        docStatusBadge.textContent = 'Parsing...';
        docStatusBadge.className = 'text-xs text-cyan-400 bg-cyan-950/60 border border-cyan-800 px-2 py-0.5 rounded-full';

        try {
          pdfPages = [];
          let totalPagesProcessed = 0;
          const MAX_TOTAL_PAGES = 10;
          const loadedFileNames = [];

          for (let fileIdx = 0; fileIdx < files.length; fileIdx++) {
            const file = files[fileIdx];
            loadedFileNames.push(file.name);
            const arrayBuffer = await file.arrayBuffer();
            const typedarray = new Uint8Array(arrayBuffer);
            const pdf = await pdfjsLib.getDocument(typedarray).promise;

            const remainingQuota = MAX_TOTAL_PAGES - totalPagesProcessed;
            const pagesToRead = Math.min(pdf.numPages, remainingQuota);

            for (let i = 1; i <= pagesToRead; i++) {
              const page = await pdf.getPage(i);
              const textContent = await page.getTextContent();
              const pageText = textContent.items.map(item => item.str).join(' ');
              pdfPages.push({
                docName: file.name,
                docIndex: fileIdx + 1,
                pageNumber: i,
                text: pageText
              });
              totalPagesProcessed++;
            }

            if (totalPagesProcessed >= MAX_TOTAL_PAGES) break;
          }

          const elapsed = Math.round(performance.now() - startTime);
          ingestionTimeVal.textContent = `${elapsed} ms (${pdfPages.length} pages total)`;
          docStatusBadge.textContent = `${files.length} PDF Ready`;
          docStatusBadge.className = 'text-xs text-emerald-400 bg-emerald-950/60 border border-emerald-800 px-2 py-0.5 rounded-full';

          docFileList.innerHTML = loadedFileNames.map((n, i) => `<div>Doc ${i + 1}: ${n}</div>`).join('');
          docFileList.classList.remove('hidden');
          conversationHistory = [];
        } catch (err) {
          console.error('PDF error:', err);
          alert('Could not parse PDF. Ensure it contains selectable text.');
          docStatusBadge.textContent = 'Error';
        }
      }

      // Speech Recognition
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRec) {
        recognition = new SpeechRec();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = 'uk-UA';

        recognition.onstart = () => {
          isRecording = true;
          micBtn.classList.add('recording-pulse');
          micStatus.textContent = 'Listening... Speak now';
        };

        recognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript;
          micStatus.textContent = `Heard: "${transcript}"`;
          handleUserQuery(transcript);
        };

        recognition.onerror = (event) => {
          micStatus.textContent = `Microphone error: ${event.error}`;
          stopMic();
        };

        recognition.onend = () => {
          stopMic();
        };
      } else {
        micStatus.textContent = 'Speech recognition not supported. Use text input below.';
      }

      function stopMic() {
        isRecording = false;
        micBtn.classList.remove('recording-pulse');
      }

      micBtn.addEventListener('click', () => {
        if (!recognition) {
          alert('Microphone speech recognition is not supported in this browser. Use text input.');
          return;
        }
        if (!isRecording) {
          try { recognition.start(); } catch(e) { console.error(e); }
        } else {
          recognition.stop();
        }
      });

      sendTextBtn.addEventListener('click', () => {
        const q = textInput.value.trim();
        if (q) {
          handleUserQuery(q);
          textInput.value = '';
        }
      });

      textInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          sendTextBtn.click();
        }
      });

      async function handleUserQuery(question) {
        const key = apiKeyInput.value.trim();
        if (!key) {
          alert('Please enter your Gemini API Key in the top field.');
          return;
        }
        if (pdfPages.length === 0) {
          alert('Please upload a PDF manual first.');
          return;
        }

        if (emptyNotice) emptyNotice.classList.add('hidden');
        queryStartTime = performance.now();
        micStatus.textContent = 'Reasoning with Flash-Lite...';

        const docContext = pdfPages.map(p => `[DOC ${p.docIndex}: "${p.docName}", PAGE ${p.pageNumber}]\n${p.text}`).join('\n\n');

        const historyContext = conversationHistory.slice(-2).map(h => `User: ${h.q}\nAssistant: ${h.a}`).join('\n');

        const prompt = `You are a factual equipment manual assistant. Answer STRICTLY based on the uploaded documents.
If information is missing, explicitly state: "The document does not contain this information." and leave quote empty and page as 0.
Support follow-ups using previous conversation.

Return ONLY a JSON object (or JSON array) with:
- spoken_answer: concise direct answer to be spoken aloud
- quote: exact verbatim sentence from the manual supporting the answer
- page: integer page number (or string like "Doc 1, P. 2")
- lang: BCP-47 language tag (e.g. "ru-RU", "en-US", "uk-UA")

CONVERSATION HISTORY:
${historyContext || 'None'}

UPLOADED MANUALS:
${docContext}

USER QUESTION: ${question}`;

        const targetModel = 'gemini-3.1-flash-lite';

        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${targetModel}:generateContent?key=${key}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: { 
                temperature: 0.0,
                maxOutputTokens: 1500,
                response_mime_type: "application/json",
                thinkingConfig: {
                  thinkingBudget: 0
                }
              }
            })
          });

          if (!response.ok) {
            const err = await response.json();
            throw new Error(err.error?.message || `HTTP ${response.status}`);
          }

          const data = await response.json();
          let raw = data.candidates[0].content.parts[0].text.trim();
          raw = raw.replace(/```json/gi, '').replace(/```/gi, '').trim();
          
          let parsed = [];
          try {
            const resObj = JSON.parse(raw);
            parsed = Array.isArray(resObj) ? resObj : [resObj];
          } catch (jsonErr) {
            parsed = [{ spoken_answer: raw, quote: '', page: 0, lang: 'ru-RU' }];
          }

          const latency = Math.round(performance.now() - queryStartTime);
          latencyTimeVal.textContent = `${latency} ms`;

          renderCardList(question, parsed, latency, targetModel);

          if (isTtsEnabled) {
            speakDirectly(parsed);
          }

          conversationHistory.push({ q: question, a: parsed.map(p => p.spoken_answer).join(' | ') });
          micStatus.textContent = 'Click mic and ask aloud';
        } catch (err) {
          console.error(err);
          micStatus.textContent = 'API Error';
          alert('Gemini Error: ' + err.message);
        }
      }

      function speakDirectly(items) {
        if (!('speechSynthesis' in window) || !isTtsEnabled) return;
        window.speechSynthesis.cancel();

        const voices = window.speechSynthesis.getVoices();

        items.forEach((item) => {
          const text = (item.spoken_answer || '').trim();
          if (!text) return;

          const u = new SpeechSynthesisUtterance(text);
          const lang = item.lang || 'ru-RU';
          u.lang = lang;

          const prefix = lang.split('-')[0].toLowerCase();
          if (voices && voices.length > 0) {
            const matched = voices.find(v => v.lang.toLowerCase().replace('_', '-').startsWith(prefix));
            if (matched) u.voice = matched;
          }

          u.rate = 1.0;
          u.pitch = 1.0;
          window.speechSynthesis.speak(u);
        });
      }

      function renderCardList(question, items, latency, modelName) {
        const card = document.createElement('div');
        card.className = 'bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-3 shadow';
        
        let answersHtml = items.map(item => {
          const langBadge = item.lang ? `<span class="bg-slate-800 text-slate-300 text-[10px] font-mono px-1.5 py-0.5 rounded uppercase">${item.lang}</span>` : '';
          const pageBadge = item.page && item.page !== 0 ? `<span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-[10px] px-1.5 py-0.5 rounded font-mono">P. ${item.page}</span>` : '';
          
          return `
            <div class="border-t border-slate-800/80 pt-2.5 first:border-0 first:pt-0 space-y-1.5">
              <div class="flex items-center gap-1.5">${langBadge} ${pageBadge}</div>
              <div class="text-sm text-slate-100 font-medium">${item.spoken_answer}</div>
              ${item.quote ? `<div class="bg-slate-950/80 border-l-2 border-emerald-500 p-2 rounded text-xs text-slate-400 font-mono italic">"${item.quote}"</div>` : ''}
            </div>
          `;
        }).join('');

        card.innerHTML = `
          <div class="flex items-start justify-between gap-2 border-b border-slate-800 pb-2">
            <div class="text-xs font-semibold text-slate-300">Q: "${question}"</div>
            <div class="flex items-center gap-2">
              <span class="text-[10px] font-mono text-cyan-400 bg-cyan-950/60 border border-cyan-800/60 px-1.5 py-0.5 rounded">${modelName}</span>
              <span class="text-[10px] font-mono text-slate-500">${latency}ms</span>
            </div>
          </div>
          ${answersHtml}
        `;
        chatContainer.prepend(card);
      }

      clearChatBtn.addEventListener('click', () => {
        conversationHistory = [];
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        chatContainer.innerHTML = '<div class="text-center py-10 text-slate-600 text-xs">Cleared.</div>';
      });
    });
  </script>
</body>
</html>
